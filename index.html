<!DOCTYPE html>
<html lang="es">

<title>Camelina Café</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght&display=swap

<style>

:root{
--verde:#43523d;
--beige:#f6f1ea;
--cafe:#5f4635;
}

body{
margin:0;
background:var(--beige);
font-family:'Montserrat',sans-serif;
color:#333;
}

.hero{
height:100vh;
background:url('hero.jpg') center/cover;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:white;
}

.hero h1{
font-family:'Cormorant Garamond',serif;
font-size:5rem;
letter-spacing:4px;
margin:0;
}

.hero p{
font-size:1.2rem;
}

.menu-nav{
position:sticky;
top:0;
background:white;
display:flex;
justify-content:center;
gap:30px;
padding:15px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
z-index:999;
}

.menu-nav a{
text-decoration:none;
color:var(--cafe);
font-weight:500;
}

.section{
max-width:1200px;
margin:auto;
padding:80px 30px;
}

.section-title{
font-family:'Cormorant Garamond',serif;
font-size:3rem;
text-align:center;
margin-bottom:50px;
color:var(--cafe);
}

.menu-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:50px;
align-items:center;
}

.menu-image img{
width:100%;
border-radius:20px;
}

.item{
display:flex;
justify-content:space-between;
margin-bottom:18px;
border-bottom:1px solid #ddd;
padding-bottom:10px;
}

.item-name{
font-weight:500;
}

.price{
font-weight:700;
color:var(--verde);
}

footer{
background:var(--cafe);
color:white;
text-align:center;
padding:40px;
}

@media(max-width:768px){

.hero h1{
font-size:3rem;
}

.menu-grid{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>
